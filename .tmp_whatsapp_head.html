  <style>
    /* ─── TOKENS ─────────────────────────────────────────────── */
    :root {
      --bg: #04070c;
      --bg2: #060c12;
      --border: rgba(255, 255, 255, 0.07);
      --border2: rgba(31, 125, 83, 0.2);
      --text: #e9f0f8;
      --muted: #6b84a0;
      --p1: #1F7D53;
      --p2: #14a86a;
      --p3: #255F38;
      --grad: linear-gradient(110deg, #1F7D53 0%, #19b370 50%, #255F38 100%);
      --glass: rgba(255, 255, 255, 0.03);
      --glass2: rgba(31, 125, 83, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    /* ─── NAVBAR ─────────────────────────────────────────────── */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      height: 62px;
      background: rgba(4, 7, 12, 0.82);
      backdrop-filter: blur(20px) saturate(1.4);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: .2px;
    }

    .nav-logo span {
      color: var(--p1);
    }

    .nav-links {
      display: flex;
      gap: 2px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      font-size: .82rem;
      font-weight: 500;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition: color .18s, border-color .18s;
    }

    .nav-links a:hover {
      color: var(--text);
      border-color: var(--border);
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      display: block;
    }

    .nav-back {
      text-decoration: none;
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      transition: border-color .18s, background .18s;
      white-space: nowrap;
    }

    .nav-back:hover {
      border-color: var(--border2);
      background: rgba(31, 125, 83, 0.06);
    }

    /* ─── HERO ───────────────────────────────────────────────── */
    .hero {
      min-height: calc(100vh - 62px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding-top: 0;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .hero-left {
      padding: 40px 56px 72px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid var(--border);
      height: 100%;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--p2);
      margin-bottom: 24px;
    }

    .tag::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background: var(--grad);
      border-radius: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(31, 125, 83, 0.1);
      border: 1px solid rgba(31, 125, 83, 0.28);
      border-radius: 999px;
      padding: 5px 14px 5px 10px;
      font-size: .73rem;
      font-weight: 600;
      color: #4ade80;
      letter-spacing: .5px;
      margin-bottom: 28px;
      width: fit-content;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: dotPulse 1.8s ease-in-out infinite;
    }

    @keyframes dotPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .4;
        transform: scale(1.5);
      }
    }

    .hero-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(3.2rem, 5vw, 5.8rem);
      font-weight: 800;
      line-height: .95;
      letter-spacing: -3.5px;
      margin-bottom: 28px;
      color: #fff;
    }

    .hero-title .hl {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-desc {
      font-size: clamp(1rem, 1.3vw, 1.14rem);
      color: #a8bdd4;
      line-height: 1.75;
      margin-bottom: 44px;
      max-width: 52ch;
    }

    .hero-list {
      list-style: none;
      display: grid;
      gap: 13px;
      margin-bottom: 48px;
    }

    .hero-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: .97rem;
      color: #c4d5e6;
      line-height: 1.5;
    }

    .li-icon {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(31, 125, 83, 0.12);
      border: 1px solid rgba(31, 125, 83, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      margin-top: -1px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: .92rem;
      border-radius: 999px;
      padding: 14px 28px;
      background: var(--grad);
      font-family: "Space Grotesk", sans-serif;
      box-shadow: 0 6px 28px rgba(31, 125, 83, 0.35);
      transition: box-shadow .2s, transform .2s;
      letter-spacing: .2px;
    }

    .btn-primary:hover {
      box-shadow: 0 12px 40px rgba(31, 125, 83, 0.5);
      transform: translateY(-1px);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 500;
      font-size: .88rem;
      border-radius: 999px;
      padding: 13px 24px;
      border: 1px solid var(--border);
      transition: color .2s, border-color .2s;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* ─── HERO RIGHT – WHATSAPP WIDGET ──────────────────────── */
    .hero-right {
      padding: 40px 48px 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: radial-gradient(ellipse 80% 80% at 60% 50%, rgba(31, 125, 83, 0.07), transparent 70%);
      position: relative;
    }

    .wa-widget {
      width: 100%;
      max-width: 430px;
      background: rgba(7, 12, 19, 0.78);
      border: 1px solid rgba(31, 125, 83, 0.22);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(31, 125, 83, 0.06),
        0 24px 64px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(31, 125, 83, 0.08);
      overflow: hidden;
      animation: widgetFloat 4s ease-in-out infinite;
    }

    @keyframes widgetFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .wa-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
    }

    .wa-dots {
      display: flex;
      gap: 6px;
    }

    .wa-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .wa-dots span:nth-child(1) {
      background: #ff5f57;
    }

    .wa-dots span:nth-child(2) {
      background: #febc2e;
    }

    .wa-dots span:nth-child(3) {
      background: #28c840;
    }

    .wa-shop {
      font-family: "Space Grotesk", sans-serif;
      font-size: .72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .wa-live {
      font-size: .68rem;
      color: #5ae49a;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .wa-live::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #5ae49a;
      box-shadow: 0 0 6px #5ae49a;
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .wa-body {
      padding: 18px 16px 16px;
      display: grid;
      gap: 10px;
      background: linear-gradient(180deg, rgba(6, 11, 17, .88), rgba(6, 11, 17, .94));
    }

    .wa-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .wa-row.user {
      justify-content: flex-end;
    }

    .wa-bubble {
      max-width: 78%;
      padding: 9px 11px;
      border-radius: 12px;
      font-size: .8rem;
      line-height: 1.45;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d7e5f2;
    }

    .wa-row.bot .wa-bubble {
      background: rgba(31, 125, 83, 0.12);
      border-color: rgba(31, 125, 83, 0.25);
      color: #cce8d7;
      border-radius: 4px 12px 12px 12px;
    }

    .wa-row.user .wa-bubble {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px 4px 12px 12px;
    }

    .wa-chip {
      margin-top: 2px;
      border: 1px solid rgba(31, 125, 83, 0.24);
      background: rgba(31, 125, 83, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .74rem;
      color: #a8c3b2;
      line-height: 1.4;
    }

    .wa-chip strong {
      display: block;
      color: #59e097;
      font-size: .76rem;
      margin-bottom: 2px;
    }

    /* ─── LIVE CHART ──────────────────────────────────────────── */
    .wa-chart {
      margin: 4px 0 0;
      border: 1px solid rgba(31, 125, 83, 0.2);
      background: rgba(4, 9, 14, 0.75);
      border-radius: 12px;
      padding: 12px 14px 10px;
      overflow: hidden;
    }

    .wa-chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .wa-chart-label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(90, 228, 154, 0.7);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .wa-chart-label::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #5ae49a;
      box-shadow: 0 0 6px #5ae49a;
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .wa-chart-value {
      font-family: "Space Grotesk", sans-serif;
      font-size: .8rem;
      font-weight: 800;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .wa-chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 48px;
    }

    .wa-bar {
      flex: 1;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, #19b370 0%, #1F7D53 100%);
      opacity: 0.85;
      animation: liveBar var(--dur, 1.2s) ease-in-out var(--del, 0s) infinite alternate;
      box-shadow: 0 0 6px rgba(25, 179, 112, 0.3);
    }

    @keyframes liveBar {
      0% {
        height: var(--lo, 20%);
        opacity: 0.6;
      }

      100% {
        height: var(--hi, 80%);
        opacity: 1;
      }
    }

    .wa-chart-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      font-size: .58rem;
      color: rgba(107, 132, 160, 0.6);
    }

    /* ─── CHAT ANIMATION ─────────────────────────────────────── */
    .wa-msg-new {
      animation: msgSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes msgSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Typing indicator bubble */
    .wa-typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 11px 14px !important;
      width: 56px;
    }

    .wa-typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(90, 228, 154, 0.7);
      display: inline-block;
      animation: typingBounce 1.1s ease-in-out infinite;
    }

    .wa-typing span:nth-child(2) {
      animation-delay: 0.18s;
    }

    .wa-typing span:nth-child(3) {
      animation-delay: 0.36s;
    }

    @keyframes typingBounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* ─── SECTION HELPERS ────────────────────────────────────── */
    .sec-tag {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--p2);
      margin-bottom: 14px;
    }

    .sec-tag::before {
      content: "";
      display: inline-block;
      width: 16px;
      height: 2px;
      background: var(--grad);
      border-radius: 2px;
    }

    .sec-h2 {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.9rem, 3.2vw, 3rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -1.2px;
      color: var(--text);
    }

    /* ─── STATS SECTION ──────────────────────────────────────── */
    .stats-section {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 72px;
      padding: 100px 80px;
      min-height: 620px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
      align-items: center;
    }

    .stats-section::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(31, 125, 83, 0.09) 0%, transparent 65%);
      pointer-events: none;
    }

    .stats-video-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stats-widget-card {
      width: 100%;
      max-width: 300px;
      background: rgba(8, 14, 24, 0.78);
      border: 1px solid rgba(31, 125, 83, 0.22);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(31, 125, 83, 0.07),
        0 32px 72px rgba(0, 0, 0, 0.55),
        0 0 60px rgba(31, 125, 83, 0.09);
      overflow: hidden;
      animation: statsFloat 4s ease-in-out infinite;
    }

    @keyframes statsFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }
    }

    .stats-widget-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.025);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .stats-widget-dots {
      display: flex;
      gap: 6px;
    }

    .stats-widget-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .stats-widget-dots span:nth-child(1) {
      background: #ff5f56;
    }

    .stats-widget-dots span:nth-child(2) {
      background: #ffbd2e;
    }

    .stats-widget-dots span:nth-child(3) {
      background: #28c840;
    }

    .stats-widget-title {
      font-size: .7rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: .9px;
      text-transform: uppercase;
    }

    .stats-widget-live {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .66rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: .5px;
    }

    .stats-widget-live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
      animation: dotPulse 1.8s ease-in-out infinite;
    }

    .stats-widget-video {
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .stats-widget-video video {
      width: 100%;
      display: block;
      opacity: .92;
    }

    .stats-widget-video-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(5, 8, 15, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(31, 125, 83, 0.28);
      border-radius: 7px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .62rem;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .stats-widget-video-label::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 4px #4ade80;
      animation: dotPulse 1.6s ease-in-out infinite;
    }

    /* 2 columns, 3 rows stat cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .stat-cell {
      background: rgba(8, 13, 22, 0.6);
      border: 1px solid rgba(31, 125, 83, 0.12);
      border-radius: 16px;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      transition: border-color .3s, background .3s, transform .3s, box-shadow .3s;
      position: relative;
      overflow: hidden;
      cursor: default;
    }

    .stat-cell:hover {
      background: rgba(10, 18, 30, 0.75);
      border-color: rgba(31, 125, 83, 0.32);
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(31, 125, 83, 0.12), 0 0 0 1px rgba(31, 125, 83, 0.18);
    }

    .stat-cell::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--grad);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .4s ease;
      border-radius: 18px 18px 0 0;
    }

    .stat-cell:hover::before {
      transform: scaleX(1);
    }

    .stat-cell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 10%, rgba(31, 125, 83, 0.08) 0%, transparent 60%);
      border-radius: 18px;
      opacity: 0;
      transition: opacity .4s;
      pointer-events: none;
    }

    .stat-cell:hover::after {
      opacity: 1;
    }

    .stat-icon {
      font-size: 1.1rem;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(31, 125, 83, 0.1);
      border: 1px solid rgba(31, 125, 83, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .stat-num {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(2rem, 3vw, 2.6rem);
      font-weight: 800;
      line-height: 1;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: block;
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .stat-label {
      font-size: .88rem;
      font-weight: 700;
      color: #dce8f5;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .stat-desc {
      font-size: .75rem;
      color: var(--muted);
      line-height: 1.55;
      max-width: none;
    }

    /* ─── CHANNELS ─────────────────────────────────────────── */
    .channels-section {
      padding: 92px 72px 60px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .channels-head {
      margin-bottom: 36px;
    }

    .channels-sub {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 60ch;
      margin-top: 12px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px 24px;
      margin-top: 26px;
    }

    .channel-card {
      background: transparent;
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .channel-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(31, 125, 83, 0.12);
      border: 1px solid rgba(31, 125, 83, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .channel-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .channel-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .channel-desc {
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 62ch;
    }

    .channel-pill {
      font-size: .68rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(31, 125, 83, 0.12);
      border: 1px solid rgba(31, 125, 83, 0.28);
      color: var(--p2);
      letter-spacing: .6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .channel-addon {
      margin-top: 30px;
      padding: 10px 0 0;
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .channel-addon-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(31, 125, 83, 0.12);
      border: 1px solid rgba(31, 125, 83, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .channel-addon-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: .9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .channel-addon-desc {
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ─── HOW IT WORKS ───────────────────────────────────────── */
    .how-section {
      padding: 100px 72px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .how-head {
      margin-bottom: 72px;
    }

    .how-desc {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 56ch;
      margin-top: 16px;
    }

    .flow-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px 22px;
      margin-top: 26px;
    }

    .flow-step {
      padding: 6px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step-marker {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-bubble {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Space Grotesk", sans-serif;
      font-size: .65rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 0 16px rgba(31, 125, 83, 0.35);
      flex-shrink: 0;
    }

    .step-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(31, 125, 83, 0.1);
      border: 1px solid rgba(31, 125, 83, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .step-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .step-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: .98rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.25;
    }

    .step-desc {
      font-size: .84rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 70ch;
    }

    /* ─── BEFORE & AFTER ─────────────────────────────────────── */
    .ba-section {
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .ba-header {
      padding: 80px 60px 36px;
    }

    .ba-sub {
      font-size: .96rem;
      color: var(--muted);
      line-height: 1.75;
      max-width: 60ch;
      margin-top: 12px;
    }

    .ba-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 0 60px 60px;
      gap: 24px;
    }

    .ba-col {
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: border-color .25s, box-shadow .25s;
      background: var(--glass);
    }

    .ba-col:hover {
      border-color: var(--border2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .ba-col.after {
      border-color: rgba(31, 125, 83, 0.16);
    }

    .ba-col.after:hover {
      border-color: rgba(31, 125, 83, 0.36);
      box-shadow: 0 8px 40px rgba(31, 125, 83, 0.12);
    }

    .ba-col-label {
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      font-family: "Space Grotesk", sans-serif;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.018);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ba-col.after .ba-col-label {
      color: var(--p2);
    }

    .ba-col-label span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .ba-list {
      list-style: none;
      padding: 24px 26px;
      display: grid;
      gap: 14px;
    }

    .ba-list li {
      display: flex;
      gap: 12px;
      font-size: .97rem;
      color: #cdd8ea;
      line-height: 1.55;
    }

    .ba-list li::before {
      content: "✕";
      color: #e05555;
      flex-shrink: 0;
      margin-top: 2px;
      font-size: .8rem;
      font-weight: 700;
    }

    .ba-col.after .ba-list li::before {
      content: "✓";
      color: var(--p1);
    }

    /* ─── FAQ ────────────────────────────────────────────────── */
    .faq-section {
      padding: 80px 60px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .faq-layout {
      display: grid;
      grid-template-columns: 1fr 1.8fr;
      gap: 80px;
      align-items: start;
    }

    .faq-sticky {
      position: sticky;
      top: 80px;
    }

    .faq-sticky-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.8rem, 2.8vw, 2.6rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 18px;
    }

    .faq-sticky-desc {
      font-size: .92rem;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .faq-cta-mini {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--p2);
      font-size: .85rem;
      font-weight: 600;
      border-bottom: 1px solid rgba(31, 125, 83, 0.3);
      padding-bottom: 2px;
      transition: border-color .2s, color .2s;
    }

    .faq-cta-mini:hover {
      color: var(--p1);
      border-color: var(--p1);
    }

    .faq-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .faq-item {
      border: 1px solid rgba(31, 125, 83, 0.12);
      border-radius: 16px;
      background: var(--glass);
      overflow: hidden;
      transition: border-color .2s;
    }

    .faq-item:hover {
      border-color: rgba(31, 125, 83, 0.3);
    }

    .faq-q-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      cursor: pointer;
      user-select: none;
    }

    .faq-q {
      font-family: "Space Grotesk", sans-serif;
      font-size: .96rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
    }

    .faq-chevron {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: .7rem;
      color: var(--muted);
      transition: transform .25s, border-color .25s, background .25s;
    }

    .faq-item.open .faq-chevron {
      transform: rotate(180deg);
      border-color: rgba(31, 125, 83, 0.3);
      background: rgba(31, 125, 83, 0.1);
      color: var(--p2);
    }

    .faq-a {
      padding: 0 22px 20px;
      font-size: .88rem;
      color: #8faabb;
      line-height: 1.78;
      display: none;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      margin-top: 0;
      padding-top: 18px;
    }

    .faq-item.open .faq-a {
      display: block;
    }

    /* ─── CTA ────────────────────────────────────────────────── */
    .cta-section {
      padding: 90px 60px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .cta-section::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 120% at 50% 100%, rgba(31, 125, 83, 0.1), transparent 60%),
        radial-gradient(ellipse 50% 80% at 10% 0%, rgba(31, 125, 83, 0.06), transparent 60%);
      pointer-events: none;
    }

    .cta-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .cta-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(31, 125, 83, 0.1);
      border: 1px solid rgba(31, 125, 83, 0.22);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--p2);
      margin-bottom: 28px;
    }

    .cta-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(2rem, 4vw, 3.6rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -1.5px;
      color: #fff;
      margin-bottom: 18px;
    }

    .cta-title span {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cta-sub {
      font-size: 1.02rem;
      color: var(--muted);
      line-height: 1.75;
      max-width: 50ch;
      margin-bottom: 36px;
    }

    .cta-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cta-note {
      margin-top: 20px;
      font-size: .76rem;
      color: var(--muted);
    }

    /* ─── SCROLL REVEAL ──────────────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .6s ease, transform .6s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-left {
      opacity: 0;
      transform: translateX(-28px);
      transition: opacity .6s ease, transform .6s ease;
    }

    .reveal-left.visible {
      opacity: 1;
      transform: translateX(0);
    }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */

    /* Hamburger button (hidden on desktop) */
    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      transition: border-color .2s;
    }

    .nav-hamburger:hover {
      border-color: var(--border2);
    }

    .nav-hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--muted);
      border-radius: 2px;
      transition: transform .25s, opacity .25s;
    }

    .nav-hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .nav-hamburger.open span:nth-child(2) {
      opacity: 0;
    }

    .nav-hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile nav drawer */
    .nav-mobile-drawer {
      display: none;
      position: fixed;
      top: 62px;
      left: 0;
      right: 0;
      background: rgba(4, 7, 12, 0.97);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
      z-index: 199;
      padding: 20px 24px 28px;
      flex-direction: column;
      gap: 6px;
    }

    .nav-mobile-drawer.open {
      display: flex;
    }

    .nav-mobile-drawer a {
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
      color: var(--muted);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid transparent;
      transition: color .18s, border-color .18s, background .18s;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .nav-mobile-drawer a:hover {
      color: var(--text);
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.03);
    }

    @media(max-width:1200px) {
      .navbar {
        padding: 0 36px;
      }

      .hero-left {
        padding: 60px 44px;
      }

      .hero-right {
        padding: 48px 36px;
      }

      .how-section,
      .faq-section,
      .cta-section {
        padding-left: 40px;
        padding-right: 40px;
      }

      .ba-header {
        padding: 60px 40px 32px;
      }

      .ba-grid {
        padding: 0 40px 48px;
      }
    }

    @media(max-width:1000px) {
      .stats-section {
        grid-template-columns: 1fr;
        gap: 48px;
        padding: 72px 40px;
      }

      .channels-grid,
      .flow-steps {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .faq-layout {
        grid-template-columns: 1fr;
        gap: 40px;
      }

      .faq-sticky {
        position: static;
      }
    }

    @media(max-width:900px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .hero-left {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 60px 40px;
      }

      .hero-right {
        padding: 48px 40px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .channel-card,
      .channel-addon {
        flex-direction: column;
        align-items: flex-start;
      }

      .ba-grid {
        grid-template-columns: 1fr;
      }

      .navbar {
        padding: 0 24px;
      }

      .nav-links {
        display: none;
      }

      .nav-hamburger {
        display: flex;
      }
    }

    @media(max-width:640px) {

      /* Navbar */
      .navbar {
        height: 56px;
        padding: 0 20px;
      }

      .nav-logo {
        font-size: .95rem;
      }

      .nav-back {
        display: none;
      }

      .nav-mobile-drawer {
        top: 56px;
      }

      /* Hero */
      .hero-left {
        padding: 44px 20px 40px;
      }

      .hero-right {
        padding: 32px 20px 40px;
      }

      .hero-title {
        font-size: 2.2rem;
        letter-spacing: -1.5px;
        line-height: 1.05;
      }

      .hero-desc {
        font-size: .92rem;
        margin-bottom: 28px;
      }

      .hero-desc br {
        display: none;
      }

      .hero-list {
        gap: 10px;
        margin-bottom: 32px;
      }

      .hero-list li {
        font-size: .88rem;
      }

      .hero-actions {
        flex-direction: column;
        gap: 10px;
      }

      .hero-actions .btn-primary,
      .hero-actions .btn-ghost {
        width: 100%;
        justify-content: center;
      }

      /* WhatsApp widget */
      .wa-widget {
        max-width: 100%;
        border-radius: 18px;
      }

      .wa-bubble {
        font-size: .76rem;
        padding: 8px 10px;
      }

      .wa-chip {
        font-size: .7rem;
      }

      .wa-chart-value {
        font-size: .72rem;
      }

      /* Stats section */
      .stats-section {
        padding: 56px 20px;
        gap: 36px;
      }

      .stats-widget-card {
        max-width: 100%;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .stat-cell {
        padding: 20px 16px;
      }

      .stat-num {
        font-size: 2rem;
      }

      .stat-label {
        font-size: .82rem;
      }

      .stat-desc {
        font-size: .72rem;
      }

      .stat-icon {
        width: 34px;
        height: 34px;
        font-size: 1rem;
        margin-bottom: 12px;
      }

      /* How it works */
      .how-section {
        padding: 52px 20px;
      }

      .how-head {
        margin-bottom: 40px;
      }

      .channels-grid,
      .flow-steps {
        grid-template-columns: 1fr;
      }

      /* Before & After */
      .ba-header {
        padding: 48px 20px 24px;
      }

      .ba-grid {
        padding: 0 20px 36px;
        gap: 14px;
      }

      .ba-list {
        padding: 18px 18px;
        gap: 12px;
      }

      .ba-list li {
        font-size: .88rem;
      }

      /* FAQ */
      .faq-section {
        padding: 52px 20px;
      }

      .faq-sticky-title {
        font-size: 1.6rem;
      }

      .faq-q {
        font-size: .88rem;
      }

      .faq-q-row {
        padding: 16px 18px;
        min-height: 52px;
      }

      .faq-a {
        padding: 0 18px 16px;
        padding-top: 14px;
        font-size: .84rem;
      }

      /* CTA */
      .cta-section {
        padding: 60px 20px;
      }

      .cta-title {
        font-size: 1.9rem;
        letter-spacing: -1px;
      }

      .cta-sub {
        font-size: .9rem;
      }

      .cta-actions {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      .cta-actions .btn-primary,
      .cta-actions .btn-ghost {
        width: 100%;
        justify-content: center;
      }

      /* Section headings */
